<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="shopBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a05"/>
      <stop offset="50%" stop-color="#1f1406"/>
      <stop offset="100%" stop-color="#2d1c07"/>
    </linearGradient>
    <radialGradient id="shopGlow" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shopAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#shopBg)"/>
  <rect width="800" height="480" fill="url(#shopGlow)"/>

  <!-- Chrome Window -->
  <rect x="40" y="30" width="720" height="420" rx="14" fill="#120c06" stroke="#3b260c" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#1c1308"/>
  <rect x="40" y="60" width="720" height="12" fill="#1c1308"/>

  <!-- Traffic Dots -->
  <circle cx="68" cy="51" r="5.5" fill="#EF4444"/>
  <circle cx="88" cy="51" r="5.5" fill="#F59E0B"/>
  <circle cx="108" cy="51" r="5.5" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="240" y="40" width="320" height="22" rx="6" fill="#0d0803" stroke="#2e1d09"/>
  <text x="400" y="55" fill="#fcd34d" font-family="monospace" font-size="11" text-anchor="middle">https://shop.nextjs.dev</text>

  <!-- Store Header -->
  <rect x="60" y="85" width="680" height="46" rx="8" fill="#1f1406" stroke="#3d270c"/>
  <text x="80" y="113" fill="#FBBF24" font-family="sans-serif" font-weight="900" font-size="16">🛍️ NOVA MART</text>
  <text x="380" y="112" fill="#94A3B8" font-family="sans-serif" font-size="11">Electronics</text>
  <text x="470" y="112" fill="#94A3B8" font-family="sans-serif" font-size="11">Fashion</text>
  <text x="540" y="112" fill="#94A3B8" font-family="sans-serif" font-size="11">Home &amp; Living</text>

  <rect x="640" y="94" width="85" height="28" rx="6" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.5"/>
  <text x="682" y="112" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🛒 Cart (3)</text>

  <!-- Product Grid -->
  <g transform="translate(60, 145)">
    <!-- Product 1 -->
    <rect width="210" height="275" rx="10" fill="#170f07" stroke="#33200a"/>
    <rect x="15" y="15" width="180" height="135" rx="8" fill="#24170a"/>
    <!-- Graphic inside Product -->
    <circle cx="105" cy="75" r="38" fill="#F59E0B" fill-opacity="0.2"/>
    <rect x="80" y="50" width="50" height="60" rx="6" fill="#F59E0B"/>
    <text x="105" y="85" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PRO</text>
    <text x="20" y="175" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Wireless Headset ANC</text>
    <text x="20" y="195" fill="#94A3B8" font-family="sans-serif" font-size="10">Active noise cancelling • 40h</text>
    <text x="20" y="225" fill="#FBBF24" font-family="monospace" font-size="16" font-weight="bold">$199.00</text>
    <rect x="20" y="238" width="170" height="30" rx="6" fill="url(#shopAccent)"/>
    <text x="105" y="258" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ADD TO CART</text>

    <!-- Product 2 -->
    <rect x="235" width="210" height="275" rx="10" fill="#170f07" stroke="#33200a"/>
    <rect x="250" y="15" width="180" height="135" rx="8" fill="#24170a"/>
    <circle cx="340" cy="75" r="38" fill="#EC4899" fill-opacity="0.2"/>
    <circle cx="340" cy="75" r="28" fill="#EC4899"/>
    <text x="340" y="80" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WATCH</text>
    <text x="255" y="175" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Smart Fitness Watch</text>
    <text x="255" y="195" fill="#94A3B8" font-family="sans-serif" font-size="10">OLED display • Heart rate GPS</text>
    <text x="255" y="225" fill="#FBBF24" font-family="monospace" font-size="16" font-weight="bold">$149.00</text>
    <rect x="255" y="238" width="170" height="30" rx="6" fill="url(#shopAccent)"/>
    <text x="340" y="258" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ADD TO CART</text>

    <!-- Product 3 -->
    <rect x="470" width="210" height="275" rx="10" fill="#170f07" stroke="#33200a"/>
    <rect x="485" y="15" width="180" height="135" rx="8" fill="#24170a"/>
    <circle cx="575" cy="75" r="38" fill="#3B82F6" fill-opacity="0.2"/>
    <rect x="550" y="55" width="50" height="45" rx="8" fill="#3B82F6"/>
    <text x="575" y="82" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AUDIO</text>
    <text x="490" y="175" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Bass Bluetooth Speaker</text>
    <text x="490" y="195" fill="#94A3B8" font-family="sans-serif" font-size="10">360 Sound • IPX7 Waterproof</text>
    <text x="490" y="225" fill="#FBBF24" font-family="monospace" font-size="16" font-weight="bold">$89.00</text>
    <rect x="490" y="238" width="170" height="30" rx="6" fill="url(#shopAccent)"/>
    <text x="575" y="258" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ADD TO CART</text>
  </g>
</svg>
