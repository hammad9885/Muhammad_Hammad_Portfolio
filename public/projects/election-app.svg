  <rect x="580" y="96" width="145" height="26" rx="6" fill="#10B981" fill-opacity="0.18" stroke="#10B981"/>
  <text x="652" y="113" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LIVE COUNTING ACTIVE</text>

  <!-- Left: Candidate Ballot Cards -->
  <rect x="60" y="145" width="340" height="280" rx="10" fill="#0c1530" stroke="#1e305e"/>
