<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="electBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172e"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <radialGradient id="electGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="electGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#electBg)"/>
  <rect width="800" height="480" fill="url(#electGlow)"/>

  <!-- Chrome Window -->
  <rect x="40" y="30" width="720" height="420" rx="14" fill="#091024" stroke="#1c2b52" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#0f1938"/>
  <rect x="40" y="60" width="720" height="12" fill="#0f1938"/>

  <!-- Traffic Dots -->
  <circle cx="68" cy="51" r="5.5" fill="#EF4444"/>
  <circle cx="88" cy="51" r="5.5" fill="#F59E0B"/>
  <circle cx="108" cy="51" r="5.5" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="240" y="40" width="320" height="22" rx="6" fill="#080d1e" stroke="#1c2d54"/>
  <text x="400" y="55" fill="#93c5fd" font-family="monospace" font-size="11" text-anchor="middle">https://election-app.vote/live-tally</text>

