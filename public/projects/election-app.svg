  <rect x="80" y="195" width="300" height="60" rx="8" fill="#121e42" stroke="#263d7a"/>
  <circle cx="110" cy="225" r="16" fill="#3B82F6"/>
  <text x="110" y="230" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">A</text>
  <text x="140" y="218" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Candidate Alpha</text>
  <text x="140" y="235" fill="#94A3B8" font-family="sans-serif" font-size="10">Digital Infrastructure Reform</text>
  <text x="360" y="230" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">48.2%</text>

  <rect x="80" y="265" width="300" height="60" rx="8" fill="#121e42" stroke="#263d7a"/>
  <circle cx="110" cy="295" r="16" fill="#10B981"/>
  <text x="110" y="300" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">B</text>
  <text x="140" y="288" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Candidate Beta</text>
  <text x="140" y="305" fill="#94A3B8" font-family="sans-serif" font-size="10">Public Health &amp; Education</text>
  <text x="360" y="300" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">42.5%</text>

  <rect x="80" y="335" width="300" height="60" rx="8" fill="#121e42" stroke="#263d7a"/>
  <circle cx="110" cy="365" r="16" fill="#F59E0B"/>
  <text x="110" y="370" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">C</text>
  <text x="140" y="358" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Candidate Gamma</text>
  <text x="140" y="375" fill="#94A3B8" font-family="sans-serif" font-size="10">Economic &amp; Trade Initiative</text>
  <text x="360" y="370" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">9.3%</text>

  <!-- Right: Real-time Analytics & Audit -->
  <rect x="420" y="145" width="320" height="280" rx="10" fill="#0c1530" stroke="#1e305e"/>
  <text x="440" y="175" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Live Vote Tabulation</text>

  <rect x="440" y="195" width="280" height="24" rx="12" fill="#17244d"/>
  <rect x="440" y="195" width="135" height="24" rx="12" fill="#3B82F6"/>
  <rect x="575" y="195" width="118" height="24" rx="0" fill="#10B981"/>
  <rect x="693" y="195" width="27" height="24" rx="12" fill="#F59E0B"/>

  <g transform="translate(440, 240)">
    <rect width="135" height="65" rx="8" fill="#121e42" stroke="#263d7a"/>
    <text x="12" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">Total Votes Cast</text>
    <text x="12" y="50" fill="#F8FAFC" font-family="monospace" font-size="18" font-weight="bold">128,490</text>

    <rect x="145" width="135" height="65" rx="8" fill="#121e42" stroke="#263d7a"/>
    <text x="157" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">Verified Blockchain</text>
    <text x="157" y="50" fill="#10B981" font-family="monospace" font-size="18" font-weight="bold">100%</text>
  </g>

  <rect x="440" y="325" width="280" height="75" rx="8" fill="#070d1e" stroke="#1b2a52"/>
  <text x="455" y="350" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="bold">AUDIT HASH: #7f8a9e01bc43</text>
  <text x="455" y="375" fill="#94A3B8" font-family="sans-serif" font-size="10">Tamper-proof cryptographic ballot tracking and real-time voter turnout validation.</text>
</svg>
