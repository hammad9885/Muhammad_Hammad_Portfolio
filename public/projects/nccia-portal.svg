<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="govBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <radialGradient id="govGlow" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#govBg)"/>
  <rect width="800" height="480" fill="url(#govGlow)"/>

  <!-- Chrome Window -->
  <rect x="40" y="30" width="720" height="420" rx="14" fill="#080e1a" stroke="#1c2c47" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#0f192e"/>
  <rect x="40" y="60" width="720" height="12" fill="#0f192e"/>

  <!-- Traffic Dots -->
  <circle cx="68" cy="51" r="5.5" fill="#EF4444"/>
  <circle cx="88" cy="51" r="5.5" fill="#F59E0B"/>
  <circle cx="108" cy="51" r="5.5" fill="#10B981"/>

  <!-- URL Bar -->
