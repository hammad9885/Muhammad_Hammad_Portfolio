  <text x="520" y="295" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">Role-Based Access (RBAC)</text>
  <text x="520" y="313" fill="#94A3B8" font-family="sans-serif" font-size="10">Multi-tier agency authorization</text>

  <rect x="505" y="345" width="215" height="65" rx="8" fill="#101d36" stroke="#1f3761"/>
  <text x="520" y="370" fill="#A78BFA" font-family="sans-serif" font-size="11" font-weight="bold">Immutable Audit Trail</text>
  <text x="520" y="388" fill="#94A3B8" font-family="sans-serif" font-size="10">Cryptographic activity logging</text>
