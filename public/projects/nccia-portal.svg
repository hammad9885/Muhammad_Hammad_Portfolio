  <text x="505" y="175" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Security Controls</text>

  <rect x="505" y="195" width="215" height="65" rx="8" fill="#101d36" stroke="#1f3761"/>
