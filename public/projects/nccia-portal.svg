  <rect x="80" y="195" width="370" height="60" rx="8" fill="#101d36" stroke="#1f3761"/>
  <text x="95" y="220" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">CASE #CC-2026-8819</text>
  <text x="95" y="238" fill="#94A3B8" font-family="sans-serif" font-size="10">Digital Forensics Evidence Verification</text>
  <rect x="360" y="208" width="75" height="20" rx="4" fill="#10B981" fill-opacity="0.2"/>
  <text x="397" y="222" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Verified</text>

  <rect x="80" y="265" width="370" height="60" rx="8" fill="#101d36" stroke="#1f3761"/>
  <text x="95" y="290" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">CASE #CC-2026-8820</text>
  <text x="95" y="308" fill="#94A3B8" font-family="sans-serif" font-size="10">Incident Reporting &amp; Workflow Dispatch</text>
  <rect x="360" y="278" width="75" height="20" rx="4" fill="#0284C7" fill-opacity="0.2"/>
  <text x="397" y="292" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Under Review</text>

  <rect x="80" y="335" width="370" height="60" rx="8" fill="#101d36" stroke="#1f3761"/>
  <text x="95" y="360" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">CASE #CC-2026-8821</text>
  <text x="95" y="378" fill="#94A3B8" font-family="sans-serif" font-size="10">Automated Audit &amp; System Log Verification</text>
  <rect x="360" y="348" width="75" height="20" rx="4" fill="#10B981" fill-opacity="0.2"/>
  <text x="397" y="362" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Compliant</text>

