<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wanderBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051412"/>
      <stop offset="50%" stop-color="#0b2420"/>
      <stop offset="100%" stop-color="#123832"/>
    </linearGradient>
    <radialGradient id="wanderGlow" cx="70%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tealOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#wanderBg)"/>
  <rect width="800" height="480" fill="url(#wanderGlow)"/>

  <!-- Chrome Window -->
  <rect x="40" y="30" width="720" height="420" rx="14" fill="#071916" stroke="#18423b" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#0f2b26"/>
  <rect x="40" y="60" width="720" height="12" fill="#0f2b26"/>

  <!-- Traffic Dots -->
  <circle cx="68" cy="51" r="5.5" fill="#EF4444"/>
  <circle cx="88" cy="51" r="5.5" fill="#F59E0B"/>
  <circle cx="108" cy="51" r="5.5" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="240" y="40" width="320" height="22" rx="6" fill="#071815" stroke="#163d36"/>
  <text x="400" y="55" fill="#99f6e4" font-family="monospace" font-size="11" text-anchor="middle">https://sitewander.explore/destinations</text>

  <!-- Navbar -->
  <rect x="60" y="85" width="680" height="46" rx="8" fill="#0e2e28" stroke="#1c544a"/>
  <text x="80" y="113" fill="#2DD4BF" font-family="sans-serif" font-weight="900" font-size="16">🧭 SITE WANDER</text>
  <text x="440" y="112" fill="#94A3B8" font-family="sans-serif" font-size="11">Destinations</text>
  <text x="530" y="112" fill="#94A3B8" font-family="sans-serif" font-size="11">Itineraries</text>
  <rect x="625" y="95" width="100" height="26" rx="5" fill="url(#tealOrange)"/>
  <text x="675" y="112" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Plan Trip</text>

  <!-- Hero Content -->
  <rect x="60" y="145" width="380" height="280" rx="10" fill="#0b2420" stroke="#17473e"/>
  <rect x="80" y="170" width="165" height="24" rx="12" fill="#134e4a" fill-opacity="0.4" stroke="#14b8a6"/>
  <text x="162" y="186" fill="#5EEAD4" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TRAVEL &amp; EXPLORATION</text>

  <text x="80" y="225" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="22">Discover The World.</text>
  <text x="80" y="255" fill="#2DD4BF" font-family="sans-serif" font-weight="900" font-size="22">Curated Journeys.</text>
  <text x="80" y="285" fill="#94A3B8" font-family="sans-serif" font-size="12">Interactive destination explorer with custom travel itinerary planner, weather forecast integration, and booking previews.</text>

  <rect x="80" y="325" width="135" height="38" rx="8" fill="url(#tealOrange)"/>
  <text x="147" y="348" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Explore Maps ➔</text>

  <!-- Destination Cards -->
  <g transform="translate(460, 145)">
    <rect width="280" height="130" rx="10" fill="#0e2e28" stroke="#1c544a"/>
    <text x="20" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Hunza Valley Expedition</text>
    <text x="20" y="60" fill="#2DD4BF" font-family="monospace" font-size="11">Northern Pakistan • 7 Days</text>
    <text x="20" y="85" fill="#94A3B8" font-family="sans-serif" font-size="10">High altitude mountain vistas &amp; ancient fort trails</text>
    <rect x="20" y="98" width="80" height="20" rx="4" fill="#14B8A6" fill-opacity="0.2"/>
    <text x="60" y="112" fill="#5EEAD4" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">★ 4.9 Rating</text>

    <rect y="145" width="280" height="135" rx="10" fill="#0e2e28" stroke="#1c544a"/>
    <text x="20" y="175" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Santorini Coastal Retreat</text>
    <text x="20" y="195" fill="#F97316" font-family="monospace" font-size="11">Aegean Sea, Greece • 5 Days</text>
    <text x="20" y="220" fill="#94A3B8" font-family="sans-serif" font-size="10">Volcanic caldera views &amp; sunset catamaran cruise</text>
    <rect x="20" y="238" width="80" height="20" rx="4" fill="#F97316" fill-opacity="0.2"/>
    <text x="60" y="252" fill="#FDBA74" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">★ 5.0 Rating</text>
  </g>
</svg>
